name: Build Zelda (LASRecomp) for iOS

on:
  push:
    branches: [main]
    paths:
      - 'zelda-ios/**'
      - '.github/workflows/build-zelda-ipa.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS
        run: |
          chmod +x zelda-ios/build-ios.sh
          bash zelda-ios/build-ios.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zelda-ios-build-log
          path: zelda-ios/build-ios/
