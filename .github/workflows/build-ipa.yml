name: Build GrasaDroid IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          cd ios
          xcodebuild \
            -project GrasaDroid.xcodeproj \
            -target GrasaDroid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload GrasaDroid-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GrasaDroid-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrasaDroid-IPA
          path: GrasaDroid-unsigned.ipa
